name: ProtoMindRemote
options:
  bundleIdPrefix: com.virencore
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  ProtoMindRemote:
    type: application
    platform: iOS
    sources:
      - ProtoMindRemote
      - Shared
      - path: ../native/Sources/MobileRemoteProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.virencore.ProtoMindRemote
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ProtoMindRemote/Info.plist
      properties:
        CFBundleDisplayName: PM Remote
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Scan a one-time QR code to pair with Proto-Mind on your Mac.
        CFBundleURLTypes:
          - CFBundleURLName: com.virencore.protomind.pair
            CFBundleURLSchemes: [protomind-remote]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
schemes:
  ProtoMindRemote:
    build:
      targets:
        ProtoMindRemote: all
